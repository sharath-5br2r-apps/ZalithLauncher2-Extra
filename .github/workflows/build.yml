name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEYSTORE_P12_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_KEY_PASSWORD:
        required: false
      KEYSTORE_ALIAS:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: "on-failure"

      - name: Decode keystore from secret
        id: keystore
        env:
          KEYSTORE_P12_BASE64: ${{ secrets.KEYSTORE_P12_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_P12_BASE64" ]; then
            echo "$KEYSTORE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using CI keystore"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "No CI keystore secret found — falling back to bundled debug keystore"
          fi

      - name: Build APK for ${{ matrix.arch }}
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || vars.KEYSTORE_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Locate generated APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          variant_lower=$(echo "${{ inputs.variant }}" | tr '[:upper:]' '[:lower:]')
          output_dir="ZalithLauncher/build/outputs/apk/${variant_lower}"

          if [ ! -d "$output_dir" ]; then
            echo "Expected output directory not found: $output_dir" >&2
            exit 1
          fi

          mapfile -t apk_files < <(find "$output_dir" -maxdepth 1 -name "*.apk" -type f | sort)

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK files found in $output_dir" >&2
            exit 1
          fi

          if [ "${#apk_files[@]}" -gt 1 ]; then
            echo "Expected exactly one APK per matrix job (arch=${{ matrix.arch }}), found ${#apk_files[@]}:" >&2
            printf '  %s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          apk_path="${apk_files[0]}"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as its own artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.arch }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

  generate-signature-hash:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate Microsoft Entra Android Signature Hash
        env:
          KEYSTORE_P12_BASE64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          _STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          _KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          _KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || vars.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_P12_BASE64" ]; then
            echo "$KEYSTORE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            KEY_ALIAS="${_KEY_ALIAS:-sharath}"
          else
            KEYSTORE_FILE="ZalithLauncher/zalith_launcher_debug.jks"
            KEY_ALIAS="movtery_zalith_debug"
            # Fall back to gradle.properties defaults if secrets are not set
            if [ -z "$_STORE_PASS" ]; then
              _STORE_PASS=$(grep '^[[:space:]]*default_store_password=' ZalithLauncher/gradle.properties | cut -d= -f2-)
            fi
            if [ -z "$_KEY_PASS" ]; then
              _KEY_PASS=$(grep '^[[:space:]]*default_key_password=' ZalithLauncher/gradle.properties | cut -d= -f2-)
            fi
          fi

          HASH=$(keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$_STORE_PASS" \
            -keypass "$_KEY_PASS" \
            | openssl sha1 -binary | openssl base64)

          echo "========================================"
          echo "Microsoft Entra Android Signature Hash"
          echo "========================================"
          echo "$HASH"
          echo "========================================"
